<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#004fa3">
    <title>PRINTFAS Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --brand-primary: #004fa3;
        --brand-secondary: #e31b23;
        --brand-accent: #f5b301;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-6 text-center">
      <img src="./assets/logo.jpg" alt="PRINTFAS" class="mb-8 h-20 w-auto" onerror="this.style.display='none'">
      <h1 class="text-3xl font-bold text-[var(--brand-primary)]">You are offline</h1>
      <p class="mt-3 text-slate-600">PRINTFAS can still open, but order submission, payment, upload, and tracking need an internet connection.</p>
      <a href="/index.html" class="mt-8 inline-flex items-center rounded-md bg-[var(--brand-primary)] px-5 py-3 text-sm font-semibold text-white">Try again</a>
    </main>
  </body>
</html>
